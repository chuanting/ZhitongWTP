# 构建静态展示版并发布到 GitHub Pages。
#
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 注意 GitHub Free 版只能从公开仓库发布 Pages。
name: Deploy static demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 构建静态展示版
        working-directory: frontend
        env:
          # Pages 部署在 https://<用户名>.github.io/<仓库名>/ 子路径下
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:static

      - name: 确认预计算数据已打包
        working-directory: frontend
        run: |
          test -f dist-static/demo-data/manifest.json \
            || { echo "::error::缺少 demo-data，请先在本地跑 scripts/build_static_demo.py 并提交产物"; exit 1; }
          echo "静态数据大小：$(du -sh dist-static/demo-data | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
