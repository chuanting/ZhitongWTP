# ── 方式 B（本地托管）：GPU 服务器上 /etc/cloudflared/config.yml ─────────────
# 仅在不用 Docker、直接用 systemd 跑 cloudflared 时需要这个文件。
# 用 Dashboard token 方式（推荐，见 CLOUDFLARE.md）则不需要，路由规则在云端管理。

tunnel: <运行 cloudflared tunnel create netai 后输出的 TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

# 指标端口，便于本地排查：curl localhost:2000/metrics
metrics: 127.0.0.1:2000

ingress:
  - hostname: netai.你的域名
    service: http://127.0.0.1:8010
    originRequest:
      connectTimeout: 10s
      # 推理请求留足时间。注意 Cloudflare 边缘本身有 100 秒上限，
      # 超过会给访问者返回 524，与这里的设置无关。
      noHappyEyeballs: false
      # 源站是回环 HTTP，无需校验证书
      noTLSVerify: false
  # 兜底规则必须放最后，否则上面的 hostname 规则不生效
  - service: http_status:404
