# ── 放在 VPS 上：/etc/nginx/conf.d/netai.conf ────────────────────────────────
# 公网入口。TLS 在这里终结，再通过 frp 隧道回到 GPU 服务器。

# 按来源 IP 限流，作为应用层限流之外的第一道闸
limit_req_zone $binary_remote_addr zone=netai_req:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=netai_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name netai.example.com;          # 改成你的域名

    # certbot 续签用
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netai.example.com;          # 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/netai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netai.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 必须 ≥ 应用的 NETAI_MAX_UPLOAD_MB，否则大 CSV 会被 nginx 先拦下报 413
    client_max_body_size 40m;
    client_body_timeout  120s;

    limit_conn netai_conn 12;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;
    gzip_min_length 1024;

    access_log /var/log/nginx/netai.access.log;
    error_log  /var/log/nginx/netai.error.log warn;

    location / {
        limit_req zone=netai_req burst=20 nodelay;

        proxy_pass http://127.0.0.1:8011;   # frp 映射出来的回环端口
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 推理可能耗时，读超时要给够；GPU 上通常 1 秒内返回
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
    }

    # 前端构建产物带内容哈希，可以长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
